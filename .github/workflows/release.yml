name: release

# Releases are cut from `main` whenever its version changes:
#
#   1. Bump the version in a PR (scripts/bump-version.sh patch|minor|major) and merge it.
#   2. This workflow sees the unreleased version on main and releases that exact commit:
#        prepare  checks who merged it, reads the version, and skips if it's already released
#        test     runs clippy and the tests (Linux + macOS) on that commit
#        tag      tags the commit vX.Y.Z
#        build    builds hako for 4 platforms from the tag
#        publish  publishes the GitHub Release with archives, SHA256SUMS and hako.toml
#
# "Run workflow" (manual) does the same for the current main, e.g. to retry a failed release.
# If anything after the tag fails or is cancelled, `cleanup` deletes the tag (and any partial release) again.

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASER: j-kop # the only GitHub user allowed to release

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check who is releasing
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
        run: |
          if [ "$ACTOR" != "$RELEASER" ] || [ "$TRIGGERING_ACTOR" != "$RELEASER" ]; then
            echo "::error::only $RELEASER can release (actor: $ACTOR, started by: $TRIGGERING_ACTOR)"
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::releases are made from main only, not $REF"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # full history and all tags

      - name: Read and check the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          locked=$(awk '/^name = "hako"$/ { getline; print }' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          if [ "$locked" != "$version" ]; then
            echo "::error::Cargo.toml says $version but Cargo.lock says $locked; run \`cargo update --workspace\`"
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/v$version" > /dev/null; then
            if [ "$EVENT" = "push" ]; then
              echo "::notice::v$version is already released; nothing to do"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::v$version is already released; bump the version in a PR first (scripts/bump-version.sh)"
            exit 1
          fi

          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$latest" ]; then
            highest=$(printf '%s\n%s\n' "${latest#v}" "$version" | sort -V | tail -n1)
            if [ "$highest" != "$version" ]; then
              echo "::error::version $version is lower than the latest release $latest"
              exit 1
            fi
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing **v$version** from \`$GITHUB_SHA\` (previous: ${latest:-none})" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: prepare
    if: ${{ needs.prepare.outputs.release == 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  tag:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Tag the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "hako $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

  build:
    needs: [prepare, tag]
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux builds are static (musl), so they run on any distro.
          - { key: x86_64-linux,  target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { key: aarch64-linux, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { key: x86_64-macos,  target: x86_64-apple-darwin,        os: macos-latest, cross: true }
          - { key: aarch64-macos, target: aarch64-apple-darwin,       os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # ring's C code builds fine with the host compiler for musl targets.
      CC_x86_64_unknown_linux_musl: gcc
      CC_aarch64_unknown_linux_musl: gcc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.prepare.outputs.version }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          out=$(target/${{ matrix.target }}/release/hako --version)
          echo "$out"
          [ "$out" = "hako $VERSION" ] || { echo "::error::expected hako $VERSION"; exit 1; }

      - name: Package
        shell: bash
        run: |
          dir="hako-$VERSION-${{ matrix.key }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/hako" README.md LICENSE "$dir/"
          tar czf "hako-${{ matrix.key }}.tar.gz" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: hako-${{ matrix.key }}
          path: hako-${{ matrix.key }}.tar.gz

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.prepare.outputs.version }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and registry manifest
        working-directory: dist
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          sha256sum hako-*.tar.gz > SHA256SUMS
          {
            echo 'name        = "hako"'
            echo 'description = "Git-based package manager (hako itself)"'
            echo "repo        = \"https://github.com/$GITHUB_REPOSITORY\""
            echo 'license     = "MIT"'
            echo 'bin         = ["hako"]'
            for key in x86_64-linux aarch64-linux x86_64-macos aarch64-macos; do
              file="hako-$key.tar.gz"
              echo
              echo "[versions.\"$VERSION\".targets.$key]"
              echo "url    = \"$base/$file\""
              echo "sha256 = \"$(sha256sum "$file" | cut -d' ' -f1)\""
            done
          } > hako.toml
          {
            echo '### hako.toml'
            echo 'Copy the `[versions."…"]` sections into `hako-packages/packages/hako.toml`:'
            echo '```toml'
            cat hako.toml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "hako $TAG"
          --generate-notes

  cleanup:
    needs: [prepare, tag, build, publish]
    if: ${{ (failure() || cancelled()) && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete the tag (and any partial release) so the release can be retried
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
          fi
          echo "Deleted $TAG; fix the problem and retry with Run workflow." >> "$GITHUB_STEP_SUMMARY"
