name: release

# Run manually: Actions → release → Run workflow. Only the repository owner can run it.
#
# 1. prepare  checks who started it, resolves the commit, and computes the next version
# 2. test     runs clippy and the tests (Linux + macOS) on that commit
# 3. tag      creates a release commit (the chosen commit + version bump) and tags it vX.Y.Z
# 4. build    builds hako for 4 platforms from the tag
# 5. publish  publishes the GitHub Release with archives, SHA256SUMS and hako.toml
#
# If anything after the tag fails or is cancelled, `cleanup` deletes the tag (and any partial release) again.
# The version bump commit only exists on the tag; `main` is never changed.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit on main to release: "latest" or a commit id'
        required: true
        default: latest
      bump:
        description: Which part of the version to increase
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASER: j-kop # the only GitHub user allowed to run this workflow

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check who is releasing
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
        run: |
          if [ "$ACTOR" != "$RELEASER" ] || [ "$TRIGGERING_ACTOR" != "$RELEASER" ]; then
            echo "::error::only $RELEASER can run releases (actor: $ACTOR, started by: $TRIGGERING_ACTOR)"
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::run this workflow from main (\"Use workflow from: main\"), not $REF"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history and all tags

      - name: Resolve commit
        id: commit
        env:
          INPUT: ${{ inputs.commit }}
        run: |
          if [ "$INPUT" = "latest" ]; then
            sha=$(git rev-parse HEAD)
          elif printf '%s' "$INPUT" | grep -Eq '^[0-9a-fA-F]{7,40}$'; then
            sha=$(git rev-parse --verify --quiet "$INPUT^{commit}") \
              || { echo "::error::commit $INPUT not found"; exit 1; }
          else
            echo "::error::commit must be \"latest\" or a commit id, got: $INPUT"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::commit $sha is not part of main's history"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing commit \`$sha\`: $(git log -1 --format=%s "$sha")" >> "$GITHUB_STEP_SUMMARY"

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$latest" ]; then
            current=${latest#v}
          else
            # No release yet: start from the version in Cargo.toml at that commit.
            current=$(git show "$SHA:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)
          fi
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          if git rev-parse --verify --quiet "refs/tags/v$version" > /dev/null; then
            echo "::error::tag v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: **$current → $version** ($BUMP)" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  tag:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Bump version in Cargo.toml and Cargo.lock
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace # updates only hako's own entry in Cargo.lock
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          if [ "$changed" != "Cargo.lock Cargo.toml " ]; then
            echo "::error::unexpected changes: $changed"
            git diff
            exit 1
          fi
          git diff

      - name: Create release commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag -a "v$VERSION" -m "hako $VERSION"
          git push origin "refs/tags/v$VERSION"

  build:
    needs: [prepare, tag]
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux builds are static (musl), so they run on any distro.
          - { key: x86_64-linux,  target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { key: aarch64-linux, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { key: x86_64-macos,  target: x86_64-apple-darwin,        os: macos-latest, cross: true }
          - { key: aarch64-macos, target: aarch64-apple-darwin,       os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # ring's C code builds fine with the host compiler for musl targets.
      CC_x86_64_unknown_linux_musl: gcc
      CC_aarch64_unknown_linux_musl: gcc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.prepare.outputs.version }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          out=$(target/${{ matrix.target }}/release/hako --version)
          echo "$out"
          [ "$out" = "hako $VERSION" ] || { echo "::error::expected hako $VERSION"; exit 1; }

      - name: Package
        shell: bash
        run: |
          dir="hako-$VERSION-${{ matrix.key }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/hako" README.md LICENSE "$dir/"
          tar czf "hako-${{ matrix.key }}.tar.gz" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: hako-${{ matrix.key }}
          path: hako-${{ matrix.key }}.tar.gz

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.prepare.outputs.version }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and registry manifest
        working-directory: dist
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          sha256sum hako-*.tar.gz > SHA256SUMS
          {
            echo 'name        = "hako"'
            echo 'description = "Git-based package manager (hako itself)"'
            echo "repo        = \"https://github.com/$GITHUB_REPOSITORY\""
            echo 'license     = "MIT"'
            echo 'bin         = ["hako"]'
            for key in x86_64-linux aarch64-linux x86_64-macos aarch64-macos; do
              file="hako-$key.tar.gz"
              echo
              echo "[versions.\"$VERSION\".targets.$key]"
              echo "url    = \"$base/$file\""
              echo "sha256 = \"$(sha256sum "$file" | cut -d' ' -f1)\""
            done
          } > hako.toml
          {
            echo '### hako.toml'
            echo 'Copy the `[versions."…"]` sections into `hako-packages/packages/hako.toml`:'
            echo '```toml'
            cat hako.toml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "hako $TAG"
          --generate-notes

  cleanup:
    needs: [prepare, tag, build, publish]
    if: ${{ (failure() || cancelled()) && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete the tag (and any partial release) so the release can be retried
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
          fi
          echo "Deleted $TAG; fix the problem and run the workflow again." >> "$GITHUB_STEP_SUMMARY"
