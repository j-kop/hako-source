name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Reused by the release workflow to test the commit being released.
  workflow_call:
    inputs:
      ref:
        description: "Commit to test (default: the commit that triggered the run)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # --locked: fail if Cargo.lock is out of date (e.g. a version bump without `cargo update --workspace`).
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
